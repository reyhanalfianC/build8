name: Build Flutter APK (Fallback Worker)

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID from Bot'
        required: true
      userId:
        description: 'User ID'
        required: true
      payload:
        description: 'Build Payload (JSON)'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare Project
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PAYLOAD: ${{ github.event.inputs.payload }}
        run: |
          set -e
          echo "$PAYLOAD" > payload.json
          cat payload.json
          ASSET_URL=$(jq -r '.zipAssetUrl // .url // empty' payload.json)
          TAG=$(jq -r '.tag // empty' payload.json)
          BUILD_TYPE=$(jq -r '.buildType // "release"' payload.json)
          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"
          if [ -z "$ASSET_URL" ]; then
            echo "::error::Tidak ada url di payload"
            exit 1
          fi
          rm -rf project project.zip
          mkdir -p project
          if ! curl -fL -o project.zip "$ASSET_URL"; then
            echo "curl gagal (repo private?), coba lewat gh release download"
            gh release download "$TAG" --pattern "*.zip" --output project.zip --clobber
          fi
          unzip -q project.zip -d project
          PUBSPEC=$(find project -maxdepth 5 -type f -name pubspec.yaml | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml tidak ditemukan di dalam ZIP"
            find project -maxdepth 3
            exit 1
          fi
          echo "PROJECT_ROOT=$(dirname "$PUBSPEC")" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
        run: |
          set -e
          cd "$PROJECT_ROOT"
          flutter pub get
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug --target-platform android-arm64
          else
            flutter build apk --release --target-platform android-arm64
          fi

      - name: Locate APK
        run: |
          set -e
          APK_PATH=$(find "$PROJECT_ROOT" -type f -name "app-$BUILD_TYPE.apk" -path "*/flutter-apk/*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK tidak ditemukan setelah build"
            find "$PROJECT_ROOT/build" -maxdepth 5 2>/dev/null || true
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ${{ env.APK_PATH }}
          compression-level: 0
          retention-days: 1
